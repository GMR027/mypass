apiVersion: v1
kind: Secret
metadata:
  name: mypass
  namespace: {{ .Release.Namespace }}
  labels:
    app: mypass
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword es obligatorio (values.local.yaml)" .Values.secrets.dbPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword es obligatorio (values.local.yaml)" .Values.secrets.mysqlRootPassword | quote }}
  APP_KEY: {{ required "secrets.appKey es obligatorio (values.local.yaml)" .Values.secrets.appKey | quote }}
  {{- if and .Values.secrets.vapidPublicKey .Values.secrets.vapidPrivateKey }}
  VAPID_PUBLIC_KEY: {{ .Values.secrets.vapidPublicKey | quote }}
  VAPID_PRIVATE_KEY: {{ .Values.secrets.vapidPrivateKey | quote }}
  {{- end }}
  {{- if .Values.mail.enabled }}
  MAIL_PASSWORD: {{ required "mail.password es obligatorio si mail.enabled=true (values.local.yaml)" .Values.mail.password | quote }}
  {{- end }}
