apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mypass-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app: mypass
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage.size }}
